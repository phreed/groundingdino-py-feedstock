# Local build matrix.
#
# On conda-forge these values come from the global pinning; declaring them here
# is what lets `rattler-build build --recipe recipe/recipe.yaml` run outside
# that infrastructure, which is how the recipe gets tested before it is pushed.
python:
  - "3.10"
  - "3.11"
  - "3.12"

# `noarch: python` outputs build once against the oldest supported interpreter.
python_min:
  - "3.10"

cuda_compiler:
  - cuda-nvcc
cuda_compiler_version:
  - "12.1"

c_compiler:
  - gcc
cxx_compiler:
  - gxx
c_stdlib:
  - sysroot
c_stdlib_version:
  - "2.17"
